name: Construire le logiciel Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-build.txt
      - name: Numéro de version
        shell: bash
        run: echo "VERSION = ${{ github.run_number }}" > scanphotos/version.py
      - name: Vérifier les modules
        run: python -c "from scanphotos import detect, orient, scanner, album; import cv2; assert hasattr(cv2, 'FaceDetectorYN')"
      - run: pyinstaller --noconfirm --onefile --windowed --name "Les albums de Marie-France" --add-data "scanphotos/models;scanphotos/models" --collect-submodules zeroconf --collect-submodules scanphotos app.py
      - name: Autotest du .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Les albums de Marie-France.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\albums_selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Autotest de la mise à jour (remplacement + relance du .exe)
        shell: pwsh
        timeout-minutes: 3  # un .exe relancé qui affiche une erreur bloque : échec net
        run: |
          $f = "$env:TEMP\albums_selftest.txt"
          Set-Content $f "EN ATTENTE"
          Start-Process -FilePath "dist\Les albums de Marie-France.exe" -ArgumentList "--test-maj"
          for ($i = 0; $i -lt 120 -and (Get-Content $f -Raw).Trim() -eq "EN ATTENTE"; $i++) { Start-Sleep 1 }
          Start-Sleep 2
          $r = Get-Content $f -Raw
          $r
          if ($r.Trim() -ne "OK") { Write-Error "le .exe relancé n'a pas passé l'autotest"; exit 1 }
          if (Test-Path "dist\Les albums de Marie-France.exe.nouveau") { Write-Error "remplacement non fait"; exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Albums-Marie-France-windows
          path: "dist/Les albums de Marie-France.exe"
      - name: Déposer la version en BROUILLON (invisible tant que Martin ne l'a pas signée)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" "dist/Les albums de Marie-France.exe" \
            --draft --target "${{ github.sha }}" \
            --title "Version ${{ github.run_number }}" \
            --notes "$(git log -1 --format=%B)"
